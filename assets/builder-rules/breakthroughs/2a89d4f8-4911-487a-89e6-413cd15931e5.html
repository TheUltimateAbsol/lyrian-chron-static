<div class="ability-list breakthrough-index-list"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Breakthrough</p><h3><a href="/breakthroughs/small-doggy--cu-sith-/">Small Doggy (Cu Sith)</a></h3></div><div class="ability-costs" aria-label="Breakthrough cost"><span class="ability-cost cost-breakthrough"><b>0</b> EXP</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>When you enter your Dog Form, you become a small dog instead. Instead of the usual bonuses and penalties, you instead lose 4 guard and 8 Block but gain a +2 Size bonus to Evasion and Dodge.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">Must be a Cu Sith.</div></section></div></div></article></div>
