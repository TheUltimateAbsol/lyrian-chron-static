<div class="ability-list breakthrough-index-list"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Breakthrough</p><h3><a href="/breakthroughs/overrun--centaur-/">Overrun (Centaur)</a></h3></div><div class="ability-costs" aria-label="Breakthrough cost"><span class="ability-cost cost-breakthrough"><b>200</b> EXP</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>When using the Charge or Spear Charge ability your movement speed is increased by 5ft and if your attack made through the Charge ability does damage, it knocks the target <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">prone</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">Must be a Centaur.</div></section></div></div></article></div>
