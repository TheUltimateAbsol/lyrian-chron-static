<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/fight-or-flight/">Fight or Flight</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p><strong>Fight: </strong>You immediately gain 2 AP that can be used on basic abilities, but lose 1 RP.</p><p><strong>Flight:</strong> You immediately gain 1 RP, but recover 2 less AP on your next turn.</p><p>You regain the use of this ability after the Encounter Conclusion phase.</p></div></div></div></article></div>
