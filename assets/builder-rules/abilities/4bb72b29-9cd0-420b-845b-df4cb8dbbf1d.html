<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/hide-in-bush/">Hide in bush</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You take the Hide action and are considered to be in cover for the purposes of remaining stealthed. This lasts until you take any action or speak.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be in natural terrain.</p></div></section></div></div></article></div>
