<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/code-blue/">Code Blue</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">Sidestep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may <a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">sidestep</a> up to your speed towards an ally and must end this movement within 5ft of them.</p><p>Your next Painkiller Injection or the AP spending of First <a class="keyword" href="/keywords/aid/" data-tooltip="Abilities with the Aid keyword can only be used on allies, unless the ability specifically states you can use it on yourself.">Aid</a> used this turn has its AP cost reduced by 1.</p></div></div></div></article></div>
