<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/meteor-cleave/">Meteor Cleave</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>3</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>15ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">Sidestep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You <a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">sidestep</a> up to 10ft towards the target and make a melee Heavy attack against them.&nbsp;</p><p>On damage, if your power is equal or higher than the target's, they are knocked <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Two-Handed melee weapon only.</p></div></section></div></div></article></div>
