<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/wire-sweep/">Wire Sweep</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You whip your wire to ensnare the target. If they fail their save against your Potency+2 they are rendered <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a> and take Light Damage.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Saboteur Threaded Dagger only.</p></div></section></div></div></article></div>
