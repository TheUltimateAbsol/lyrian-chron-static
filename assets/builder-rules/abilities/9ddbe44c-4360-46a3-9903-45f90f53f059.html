<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/mana-burst/">Mana Burst</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/augment/" data-tooltip="An attack that has been modified by an Augment effect cannot be modified again and given another Augment effect.">Augment</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You <a class="keyword" href="/keywords/augment/" data-tooltip="An attack that has been modified by an Augment effect cannot be modified again and given another Augment effect.">augment</a> your next attack, increasing accuracy by 3 and dealing 3 bonus damage on hit.</p><p>You may use AP for this attack instead.&nbsp;</p></div></div></div></article></div>
