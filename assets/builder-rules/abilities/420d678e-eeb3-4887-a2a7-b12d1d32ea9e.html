<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/driftwind-evasion/">Driftwind Evasion</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You take the Dodge action against the attack and gain a Windflow bonus to your Dodge equal to your Windflow stacks.</p><p>Afterwards, you lose all Windflow stacks.</p></div></div></div></article></div>
