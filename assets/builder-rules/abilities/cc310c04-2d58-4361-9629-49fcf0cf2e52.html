<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/faerie-flash/">Faerie Flash</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>-</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/teleport/" data-tooltip="You teleport instead of moving normally. Teleportation does not provoke Attacks of Opportunity and ignores most forms of roots and grapples. You need to see where you teleport to, but can otherwise ignore difficult terrain and solid objects in the way. Unless ">Teleport</a></span><span><a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You <a class="keyword" href="/keywords/teleport/" data-tooltip="You teleport instead of moving normally. Teleportation does not provoke Attacks of Opportunity and ignores most forms of roots and grapples. You need to see where you teleport to, but can otherwise ignore difficult terrain and solid objects in the way. Unless ">Teleport</a> up to twice your Speed to an unoccupied space that you can see. Can only be used once per encounter.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
