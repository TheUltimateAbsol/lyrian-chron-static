<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/verdant-instinct/">Verdant Instinct</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-other"><b>1 Strike Dice</b> Other</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>Make a gathering check and apply it to NP. After rolling, roll two more dice that will be used as your next 2 strike dice values. You may reorder them or replace one with a 5.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be in a gathering session.</p></div></section></div></div></article></div>
