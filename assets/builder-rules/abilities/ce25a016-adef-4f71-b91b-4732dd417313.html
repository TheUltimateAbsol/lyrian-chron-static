<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/gleaming-cut/">Gleaming Cut</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Light</span><span><a class="keyword" href="/keywords/rapid/" data-tooltip="This ability can be used more than once per turn.">Rapid</a></span><span><a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You attack with blades of pure light making a light attack against the target, dealing Holy(Light) damage. On damage, inflict <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a>&nbsp; X where X equals your Focus / 2 (Rounded Down) until the end of your next turn.</p></div></div></div></article></div>
