<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/elbow-uppercut/">Elbow Uppercut</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Bajiquan</span><span><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a></span><span><a class="keyword" href="/keywords/unarmed-strike/" data-tooltip="This ability must be made with an unarmed attack.">Unarmed Strike</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You attack the target for Heavy Damage. <strong><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a>:</strong> If used after an ability with the <a class="keyword" href="/keywords/unarmed-strike/" data-tooltip="This ability must be made with an unarmed attack.">Unarmed Strike</a> keyword, this ability gains <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
