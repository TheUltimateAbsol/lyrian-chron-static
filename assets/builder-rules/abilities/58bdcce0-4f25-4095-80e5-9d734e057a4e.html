<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/trial-by-fire/">Trial By Fire</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/challenge/" data-tooltip="If a challenged character does not include the challenger as a target when making an attack, they provoke a melee attack of opportunity from the challenger. This does not trigger if the challenged target makes an attack of opportunity or if the challenger is n">Challenge</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against the target. On damage, they are challenged by you until the start of your next turn.</p><p>&nbsp;If this does not deal damage, they cannot be challenged by you until the start of your next turn.</p></div></div></div></article></div>
