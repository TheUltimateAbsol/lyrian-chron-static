<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/lightning-strikes-twice/">Lightning Strikes Twice</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When the <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> you apply deals damage to an enemy, that enemy becomes afflicted with <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> X, where X is the value of the <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> that damaged it.</p></section></div></div></article></div>
