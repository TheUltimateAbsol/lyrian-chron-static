<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/anathema/">Anathema</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Curse</span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You choose one target unit and they must save against your Potency or be afflicted by <strong>Anathema</strong>. <strong>Anathema </strong>increases the next source of damage that the target receives by your Heavy Attack damage.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
