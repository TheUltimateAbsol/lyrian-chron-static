<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/separate-wheat-from-chaff/">Separate wheat from chaff</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>3</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>10ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/killing-blow/" data-tooltip="Killing Blow effects trigger when reducing the HP of enemy to 0 or lower. You cannot benefit from the same Killing Blow effect against the same target more than once.">Killing Blow</a></span><span>Fear</span><span>Mind Affecting</span><span><a class="keyword" href="/keywords/scatter/" data-tooltip="When you make an attack against multiple targets with this ability, roll a separate accuracy and damage check against each target.">Scatter</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against all enemies in range. On damage, you push the target back 5ft. If you landed a <a class="keyword" href="/keywords/killing-blow/" data-tooltip="Killing Blow effects trigger when reducing the HP of enemy to 0 or lower. You cannot benefit from the same Killing Blow effect against the same target more than once.">Killing Blow</a>, all that took damage become <a class="keyword" href="/keywords/shaken/" data-tooltip="The target&#39;s maximum AP is reduced by 1.">Shaken</a> as well.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Scythe only</p></div></section></div></div></article></div>
