<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/this-is-our-moment-/">This is our moment!</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>30ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/song/" data-tooltip="A character can only have 1 Song active at the same time.">Song</a></span><span><a class="keyword" href="/keywords/sound/" data-tooltip="This ability&#39;s effect is based around sound. Those who can&#39;t hear it are unaffected.">Sound</a></span><span>Idol</span><span><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>All allies within range gain a +1 <a class="keyword" href="/keywords/song/" data-tooltip="A character can only have 1 Song active at the same time.">Song</a> bonus to their damage rolls. This bonus is doubled on Heavy attacks.</p><p><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a>: 1 AP</p></div></div></div></article></div>
