<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/paragon-of-virtue/">Paragon of Virtue</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may remove a single negative non-physical effect from yourself (ie, fears, charms but not things such as bleed). If you are afflicted with more than 1 negative effect that is a valid target, you may choose which one you remove.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
