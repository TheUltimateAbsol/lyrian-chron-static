<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/corpse-puppetry/">Corpse Puppetry</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>4</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may control a corpse less than a week old within 30ft of you to perform simple actions, such as moving or talking.&nbsp;</p><p>A corpse used this way has no combat stats and cannot attack.&nbsp;</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Target must be dead.</p></div></section></div></div></article></div>
