<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/titan-s-grip/">Titan&#39;s Grip</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>You may wield a Two-Handed weapon in 1 hand allowing you to use a second (Two-Handed) weapon or shield in your offhand. </p></section><section><h4>Benefit 2</h4><p>While dual wielding Two-Handed weapons, you may make <a class="keyword" href="/keywords/dual-wield/" data-tooltip="This ability counts as your dual wield attack for the turn. You cannot use this ability if you have already made a dual wield attack this turn. After using it, you cannot make another dual wield attack this turn.">dual wield</a> attacks as if they were One-Handed weapons.</p></section></div></div></article></div>
