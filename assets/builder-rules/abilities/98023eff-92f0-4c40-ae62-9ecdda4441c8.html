<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/envenom-weapon/">Envenom Weapon</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/enchantment/" data-tooltip="An enchantment is placed on a weapon. A weapon can only have 1 enchantment at the same time. If an enchantment is placed on a channeling weapon, it transfer the enchantment properties to any spells cast while holding it.">Enchantment</a></span><span><a class="keyword" href="/keywords/stealth/" data-tooltip="This ability does not pull you out of Hiding. You must still be in low cover or concealment after using this ability to remain in Hiding.">Stealth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You enchant your weapon with a minor venom, making your attacks deal 1 additional <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">full pierce</a> Poison damage when you hit an enemy.</p><p>Lasts until the end of the encounter.</p></div></div></div></article></div>
