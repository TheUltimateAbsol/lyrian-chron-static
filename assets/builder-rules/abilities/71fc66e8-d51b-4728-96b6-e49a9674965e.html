<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/until-my-voice-breaks/">Until My Voice Breaks</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>Whenever you’re about to pay mana on one of your abilities with the Idol keyword, you may instead reduce your current and max HP by 8 for each mana you’d spend.</p><p>This max HP reduction lasts until the end of the encounter and cannot be removed.</p></div></div></div></article></div>
