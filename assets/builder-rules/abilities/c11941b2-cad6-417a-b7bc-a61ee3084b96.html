<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/brilliance/">Brilliance</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>80ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span><a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a></span><span>Light</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against the target dealing Holy(Light) damage. On damage, inflict <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a> X, where X equals your Focus / 2 (rounded down) until the end of your next turn.</p></div></div></div></article></div>
