<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/feign-death/">Feign Death</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>The first time you enter the Downed state in an encounter, you may use Play Dead as a reaction for 0 RP. In addition, you gain a +10 bonus to playing dead.</p></div></div></div></article></div>
