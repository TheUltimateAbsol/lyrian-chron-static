<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/mind-s-eye/">Mind&#39;s Eye</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may ask the GM for the rough best course of action during an encounter based on the information you have. The GM should answer truthfully, but does not need to go in depth. (For example: Retreat, kill the grunts, focus the boss, use magic attacks etc).</p></div></div></div></article></div>
