<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/living-cover/">Living Cover</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>While mounted, any ally within 5ft of you may use you as Low Cover. If an attack would miss them because of your cover benefit, the attack instead hits you.</p></section></div></div></article></div>
