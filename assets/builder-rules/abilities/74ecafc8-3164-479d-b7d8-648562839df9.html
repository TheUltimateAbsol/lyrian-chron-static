<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/stone-rebuke/">Stone Rebuke</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/unarmed-strike/" data-tooltip="This ability must be made with an unarmed attack.">Unarmed Strike</a></span><span><a class="keyword" href="/keywords/unbalanced/" data-tooltip="Your next attack that costs AP (even 0 AP) costs 1 extra AP.">Unbalanced</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against the target. On damage, the target becomes <a class="keyword" href="/keywords/unbalanced/" data-tooltip="Your next attack that costs AP (even 0 AP) costs 1 extra AP.">Unbalanced</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>The target has defied your <a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">mandate</a>.</p></div></section></div></div></article></div>
