<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/fan-of-knives/">Fan of Knives</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/scatter/" data-tooltip="When you make an attack against multiple targets with this ability, roll a separate accuracy and damage check against each target.">Scatter</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Light Attack against all enemies in range. This is considered a Ranged Weapon Attack that does not provoke attacks of opportunity.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Throwing Weapon, Set of Missiles or Thrown attack only.</p></div></section></div></div></article></div>
