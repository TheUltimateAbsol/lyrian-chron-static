<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/sable-grace/">Sable Grace</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/stealth/" data-tooltip="This ability does not pull you out of Hiding. You must still be in low cover or concealment after using this ability to remain in Hiding.">Stealth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You take the Dodge action against the triggering attack. You remove Lock-On from this attack and treat your Dodge as 99 against it.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You become the target of an attack. Can only be used during the night.</p></div></section></div></div></article></div>
