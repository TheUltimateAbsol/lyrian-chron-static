<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/warning-shot/">Warning Shot</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Ranged Weapon Range</strong></div></div><div class="ability-full-text"><div class="prose ability-description">You fire a warning shot against a target in your range. Your next basic attack or Ricochet ability with a pistol against that target gains the <a class="keyword" href="/keywords/trick-attack/" data-tooltip="The target of the attack must spend double RP to react to a Trick Attack.">Trick Attack</a> keyword.</div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be done with a pistol.</p></div></section></div></div></article></div>
