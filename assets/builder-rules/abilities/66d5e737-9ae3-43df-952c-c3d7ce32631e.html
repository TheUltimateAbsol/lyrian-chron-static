<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/sanctity-aura/">Sanctity Aura</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Aura</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You project an aura 30ft around you that blesses your allies.</p><p>When an ally makes an attack as part of one of your Gun Paladin abilities, they may choose to make the damage type of that attack the same as your Holy Weapon damage type.</p></div></div></div></article></div>
