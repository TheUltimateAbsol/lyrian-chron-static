<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/steady-ground/">Steady Ground</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/aid/" data-tooltip="Abilities with the Aid keyword can only be used on allies, unless the ability specifically states you can use it on yourself.">Aid</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>The target gains <a class="keyword" href="/keywords/immovable/" data-tooltip="While not flying, effects from other creatures that knock you prone or force you to move such as knockbacks are ineffective.">Immovable</a> until the start of their next turn.</p><p>You may also use this for 2 AP instead.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>The target must be touching the ground.</p></div></section></div></div></article></div>
