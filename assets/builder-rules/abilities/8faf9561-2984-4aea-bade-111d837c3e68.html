<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/two-sword-crush/">Two Sword Crush</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a></span><span><a class="keyword" href="/keywords/augment/" data-tooltip="An attack that has been modified by an Augment effect cannot be modified again and given another Augment effect.">Augment</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may add your Light damage to the attack.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Can be used after hitting an attack with a Two-Handed melee weapon. Must be dual wielding a second Two-Handed melee weapon.</p></div></section></div></div></article></div>
