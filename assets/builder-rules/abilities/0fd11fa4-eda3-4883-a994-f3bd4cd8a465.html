<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/overclock/">Overclock</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You may add 1d10 crafting points to the item. The item starts in the&nbsp;<strong><a class="keyword" href="/keywords/broken/" data-tooltip="Only applies to equipment. Armor and shields that are broken provide no benefit or negatives. Weapons that are broken can only be used as an improvised weapon.">Broken</a>&nbsp;</strong>condition. Cannot be used for Alchemy crafting.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be in a crafting session.</p></div></section></div></div></article></div>
