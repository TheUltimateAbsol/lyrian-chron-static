<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/controlled-wind/">Controlled Wind</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When pushing a target back or up with a Wind <a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a>, you may choose to push up to the maximum distance instead of always pushing the maximum distance.</p></section></div></div></article></div>
