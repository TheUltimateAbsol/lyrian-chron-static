<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/expanded-menagerie/">Expanded Menagerie</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>You may spend 1 mana with using <a class="keyword" href="/keywords/summon/" data-tooltip="This ability counts towards your maximum summon limit. You can only have 2 summons active at the same time. A summon does not count as a valid target for abilities that require a ‘willing’ ally.">Summon</a> Animal to choose which animal you summon.</p></section><section><h4>Benefit 2</h4><p>You add the Cheetah and Landshark to the pool of animals you can summon.</p></section></div></div></article></div>
