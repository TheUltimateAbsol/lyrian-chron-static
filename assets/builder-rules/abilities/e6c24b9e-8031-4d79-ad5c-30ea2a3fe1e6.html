<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/prediction/">Prediction</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/aid/" data-tooltip="Abilities with the Aid keyword can only be used on allies, unless the ability specifically states you can use it on yourself.">Aid</a></span><span>Divination</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You remove the keyword <a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a> and <a class="keyword" href="/keywords/lock-on/" data-tooltip="Lock On attacks ignore the bonus from dodge.">Lock On</a> from the triggering attack and the target gains a +2 Dodge Bonus for their next Dodge action.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>An ally is the target of an attack.</p></div></section></div></div></article></div>
