<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/flame-weapon/">Flame Weapon</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Touch</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/enchantment/" data-tooltip="An enchantment is placed on a weapon. A weapon can only have 1 enchantment at the same time. If an enchantment is placed on a channeling weapon, it transfer the enchantment properties to any spells cast while holding it.">Enchantment</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You touch one willing ally’s or your own weapon and enchant it with <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a>. Until the end of the encounter, the weapon deals <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a> Damage and grants a +1 Power <a class="keyword" href="/keywords/enchantment/" data-tooltip="An enchantment is placed on a weapon. A weapon can only have 1 enchantment at the same time. If an enchantment is placed on a channeling weapon, it transfer the enchantment properties to any spells cast while holding it.">Enchantment</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
