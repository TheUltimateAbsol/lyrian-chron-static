<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/dark-healing/">Dark Healing</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Dark</span><span><a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a></span><span>Healing</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You take Light (1 AP) or Heavy damage (2 AP), then heal a target within range an amount equal to damage taken.</p><p>You may choose to ignore Dark resistance or damage reduction on yourself for this damage.</p></div></div></div></article></div>
