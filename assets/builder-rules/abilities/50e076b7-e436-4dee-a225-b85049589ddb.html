<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--martial-law/">Secret Art: Martial Law</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>3</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">Mandate</a></span><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You apply <a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">Mandate</a> to all enemies within range. Until the start of your next turn, this <a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">mandate</a> is not removed from enemies after they attack.</p></div></div></div></article></div>
