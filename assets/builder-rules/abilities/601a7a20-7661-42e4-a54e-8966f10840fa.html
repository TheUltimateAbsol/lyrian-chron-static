<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/mountain-s-verdict/">Mountain&#39;s Verdict</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/unarmed-strike/" data-tooltip="This ability must be made with an unarmed attack.">Unarmed Strike</a></span><span><a class="keyword" href="/keywords/active/" data-tooltip="You cannot use the Prepare action on this ability.">Active</a></span><span><a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">Mandate</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against the target. On damage, apply <a class="keyword" href="/keywords/mandate/" data-tooltip="You must target the inflicter of this debuff with your next single-target attack. If you don’t, you have defied the mandate. The Challenge effect is suppressed while Mandate is on you.">Mandate</a> to the target.</p><p>Your next Stone Rebuke used against that target before the start of your next turn gains <a class="keyword" href="/keywords/lockstep/" data-tooltip="This attack always matches the target&#39;s base evasion (including bonuses etc, but they may still dodge it like normal).">Lockstep</a>.</p></div></div></div></article></div>
