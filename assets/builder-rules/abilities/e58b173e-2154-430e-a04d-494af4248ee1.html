<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/improvised-defense/">Improvised Defense</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description">You grab a nearby item and use it as cover against the triggering attack while taking the Dodge or Block action. The type of item used determines whether it is light, heavy or full cover.</div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You become the target of an attack.</p></div></section></div></div></article></div>
