<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/shared-defense/">Shared Defense</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>120ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Your mount (the last mount you were riding on this arc) may use your defenses instead of its own while within range. In addition, you may spend RP for it while dismounted if your mount is in range.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be dismounted.</p></div></section></div></div></article></div>
