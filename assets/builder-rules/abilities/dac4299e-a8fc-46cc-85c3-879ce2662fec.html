<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/sound-the-retreat/">Sound the retreat</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>4</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">Sidestep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You <a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">sidestep</a> 4 times your speed, moving as far away from visible enemies as possible. After that, your allies may <a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">sidestep</a> up to twice their speed towards you.</p></div></div></div></article></div>
