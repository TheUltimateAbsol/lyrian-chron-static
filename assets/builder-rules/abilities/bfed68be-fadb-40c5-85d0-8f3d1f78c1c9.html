<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/chilling-cold/">Chilling Cold</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You can emit a cooling wind within 30ft that counters the effects of most hot weather. You can enable or disable this every 1 second. In addition you gain Elemental Mastery: Frost.</p></div></div></div></article></div>
