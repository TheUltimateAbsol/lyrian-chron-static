<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/dark-bolt/">Dark Bolt</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Dark</span><span><a class="keyword" href="/keywords/half-pierce/" data-tooltip="Half Pierce attacks ignore Guard, unless the target takes the Block action or Dodge action.">Half Pierce</a></span><span><a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You fire a bolt of darkness at a target, making a Light Attack that deals Dark Damage. You may take true damage equal to your Power + 3 to give this ability <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a>.</p></div></div></div></article></div>
