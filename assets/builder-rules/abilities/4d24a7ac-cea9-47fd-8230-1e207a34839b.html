<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/unpetrify/">Unpetrify</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You remove the <a class="keyword" href="/keywords/petrify/" data-tooltip="You gain +10 guard, but all attacks against you automatically hit and you cannot take any actions. You may be used as cover and any attack missing due to cover bonus you give hits you instead. Petrify cannot be removed by normal effects that remove debuffs, on">Petrify</a> condition from a target within range.</p><p>If you are petrified, you may use this on yourself despite normally being unable to act.</p></div></div></div></article></div>
