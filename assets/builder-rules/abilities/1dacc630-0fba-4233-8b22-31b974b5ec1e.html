<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/cloak-of-bats/">Cloak of Bats</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>2</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/teleport/" data-tooltip="You teleport instead of moving normally. Teleportation does not provoke Attacks of Opportunity and ignores most forms of roots and grapples. You need to see where you teleport to, but can otherwise ignore difficult terrain and solid objects in the way. Unless ">Teleport</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You vanish into a swarm of bats and reappear somewhere else within range. If this was used in reaction to an attack, that attack automatically misses you.</p></div></div></div></article></div>
