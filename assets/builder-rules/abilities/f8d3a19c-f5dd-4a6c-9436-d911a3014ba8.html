<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/partial-petrification/">Partial Petrification</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>3</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/circuit/" data-tooltip="The first time each combat you use an ability with this keyword, the mana cost is reduced by 1. Afterwards, this mana cost reduction is removed from all abilities with this keyword.">Circuit</a></span><span><a class="keyword" href="/keywords/calcification/" data-tooltip="Your agility is lowered by 1.">Calcification</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>The target must make a save or begin to suffer partial petrification. They lose 1 RP and gain 1 stack of <a class="keyword" href="/keywords/calcification/" data-tooltip="Your agility is lowered by 1.">Calcification</a>.</p></div></div></div></article></div>
