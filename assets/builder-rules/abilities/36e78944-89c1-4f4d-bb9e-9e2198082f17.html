<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/horse-step-acceleration/">Horse Step Acceleration</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/opener/" data-tooltip="This ability can only be used as the first action in a turn. (Paying upkeep does not count as an action)">Opener</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You gain <strong>Horse Step Acceleration </strong>until the start of your next turn, which increases movement speed by 30. &nbsp;All of your movement is now Line Movement (You may only move in a straight line when making a movement action).</p></div></div></div></article></div>
