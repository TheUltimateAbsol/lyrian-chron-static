<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/crimson-enmity/">Crimson Enmity</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>When your HP is at or below 50% of your max HP in an Encounter, you gain <strong>Crimson Enmity</strong>. When you would heal an ally or yourself with an ability from this class (Bloodbinder), you heal for 1.5x that amount.</p></div></div></div></article></div>
