<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/stasis/">Stasis</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You put a Grunt level character or any willing ally into Stasis until the start of your next turn. While in Stasis, they cannot be affected by any ability, attack or anything similar but they also cannot take any actions.</p></div></div></div></article></div>
