<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/painkiller-injection/">Painkiller Injection</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap cost-variable" title="Variable AP cost; see the ability rules."><b>Variable</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/aid/" data-tooltip="Abilities with the Aid keyword can only be used on allies, unless the ability specifically states you can use it on yourself.">Aid</a></span><span><a class="keyword" href="/keywords/active/" data-tooltip="You cannot use the Prepare action on this ability.">Active</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You inject a willing ally with some helpful drugs to grant them temporary HP until the start of your next turn equal to your Focus x X.&nbsp;</p><p>The target cannot benefit from this ability again until the end of your next turn.</p></div></div></div></article></div>
