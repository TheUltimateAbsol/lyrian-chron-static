<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/thread-of-reprieve/">Thread of Reprieve</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/active/" data-tooltip="You cannot use the Prepare action on this ability.">Active</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You apply the Threads of Reprieve to a single ally until the start of your next turn&nbsp;</p><p>If that ally takes damage while the threads remain attached, you may spend 1 mana to heal them 3+Focus, up to the damage they took.</p></div></div></div></article></div>
