<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/rolling-thunder/">Rolling Thunder</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>After moving at least 40ft in a turn, your next <a class="keyword" href="/keywords/unarmed-strike/" data-tooltip="This ability must be made with an unarmed attack.">unarmed strike</a> that turn gains a +2 Transcendent Lightning bonus to accuracy and damage.</p></section></div></div></article></div>
