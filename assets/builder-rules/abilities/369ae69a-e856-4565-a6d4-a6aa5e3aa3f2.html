<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/fallen-friend/">Fallen Friend</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When an Heroic tier ally reaches 0 HP, you may immediately enter <a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a> <a class="keyword" href="/keywords/stance/" data-tooltip="Only 1 Stance ability can be active at the same time.">Stance</a> for 0 AP and RP as well as 0 mana. You can use this even if you don’t have the <a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a> ability yet.</p></section></div></div></article></div>
