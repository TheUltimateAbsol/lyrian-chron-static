<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--jade-skin/">Secret Art: Jade Skin</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span><span><a class="keyword" href="/keywords/disarm/" data-tooltip="When disarmed, you cannot make weapon attacks with the weapon you were wielding when you got disarmed. You must draw the weapon again to use it when the Disarm ends. Unarmed attacks are unaffected by Disarm.">Disarm</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You take the Block action against the triggering attack. If you reduce the damage to 0, the attacker becomes Disarmed until the start of their next turn.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You are attacked by a Melee attack.</p></div></section></div></div></article></div>
