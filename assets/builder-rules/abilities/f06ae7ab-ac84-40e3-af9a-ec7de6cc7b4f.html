<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/pathfinder/">Pathfinder</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/stealth/" data-tooltip="This ability does not pull you out of Hiding. You must still be in low cover or concealment after using this ability to remain in Hiding.">Stealth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may move up to your speed and you ignore difficult terrain penalties for this movement. Until the start of your next turn, all terrain within 20ft of you is not considered difficult terrain for your allies.</p></div></div></div></article></div>
