<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/stygian-screen/">Stygian Screen</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>30ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Dark</span><span><a class="keyword" href="/keywords/concentration/" data-tooltip="A character can only have 1 Concentration effect active at the same time. They may drop a Concentration effect during their turn for 0 AP. When a character gets Downed, they lose Concentration.">Concentration</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You create a wall of darkness that is 20ft long, 5ft wide and 10ft high. This wall must be a straight line.&nbsp; This wall blocks line of sight. Targets inside of the wall can only see 5ft away</p></div></div></div></article></div>
