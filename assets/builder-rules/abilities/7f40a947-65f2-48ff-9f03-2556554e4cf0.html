<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/line-of-death/">Line of Death</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/half-pierce/" data-tooltip="Half Pierce attacks ignore Guard, unless the target takes the Block action or Dodge action.">Half Pierce</a></span><span><a class="keyword" href="/keywords/overcharge/" data-tooltip="You may spend additional AP and/or Mana to increase the power of the ability.">Overcharge</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Light Attack against the target. <strong><a class="keyword" href="/keywords/overcharge/" data-tooltip="You may spend additional AP and/or Mana to increase the power of the ability.">Overcharge</a>:</strong> You may spend 1 additional mana and AP to make another Light Attack against the same target.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Slashing weapons only.</p></div></section></div></div></article></div>
