<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/earth-armor/">Earth Armor</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/enchantment/" data-tooltip="An enchantment is placed on a weapon. A weapon can only have 1 enchantment at the same time. If an enchantment is placed on a channeling weapon, it transfer the enchantment properties to any spells cast while holding it.">Enchantment</a></span><span><a class="keyword" href="/keywords/aid/" data-tooltip="Abilities with the Aid keyword can only be used on allies, unless the ability specifically states you can use it on yourself.">Aid</a></span><span>Earth</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You touch a willing ally’s armor and enchant it with earthen power. Until the end of the encounter, it grants a +1 guard and +4 block bonus.</p></div></div></div></article></div>
