<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/spiked-armor/">Spiked Armor</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Counter</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Until the start of your next turn, the spikes on your armor and shield reflect damage when you are attacked. When an enemy hits you with a melee attack, they take 4 <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">full pierce</a> damage.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be wearing armor and/or a shield.</p></div></section></div></div></article></div>
