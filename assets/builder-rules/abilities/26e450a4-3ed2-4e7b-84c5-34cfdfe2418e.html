<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/take-the-advantage/">Take the advantage</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When attacking a target inflicted with <a class="keyword" href="/keywords/offstep/" data-tooltip="Attacks against you always meet your base evasion (Including bonuses etc, but you may still dodge them like normal).">Offstep</a>, <a class="keyword" href="/keywords/stagger/" data-tooltip="A character inflicted with Stagger has their evasion reduced by X, where X is the Stagger value.">Stagger</a> or <a class="keyword" href="/keywords/blinded/" data-tooltip="Blinded characters suffer a -X penalty to their accuracy rolls where X is the blinded value. If they are Blinded for 3 or higher, they cannot make any ranged attacks without first locating a target through another means than sight. If they are blinded for 5 or">Blinded</a>, you gain a +1 accuracy bonus against them.</p></section></div></div></article></div>
