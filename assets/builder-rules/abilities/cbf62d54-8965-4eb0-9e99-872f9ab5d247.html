<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/giant-strength/">Giant Strength</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>While in <a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a> <a class="keyword" href="/keywords/stance/" data-tooltip="Only 1 Stance ability can be active at the same time.">Stance</a>, you may choose to have your size be treated as one size bigger than it actually is. You get an additional +5 bonus to Fitness checks during <a class="keyword" href="/keywords/rage/" data-tooltip="This ability can be used while in Rage Stance.">Rage</a> stance regardless.</p></section></div></div></article></div>
