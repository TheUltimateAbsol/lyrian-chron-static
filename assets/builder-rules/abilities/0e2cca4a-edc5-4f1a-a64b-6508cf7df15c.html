<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/first-response/">First Response</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>If you have a Medical Kit, you may use your encounter conclusion to give the Second Wind encounter conclusion effect to someone else. You heal for an additional 1d6 (+3 from your Demonblood Regeneration if you have it) when doing this.&nbsp;</p></div></div></div></article></div>
