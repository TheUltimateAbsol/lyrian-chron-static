<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/mending/">Mending</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>You may spend an EP to restore a <a class="keyword" href="/keywords/broken/" data-tooltip="Only applies to equipment. Armor and shields that are broken provide no benefit or negatives. Weapons that are broken can only be used as an improvised weapon.">Broken</a> item. Some items (such as consumables) cannot be repaired (GM’s discretion).</p></section></div></div></article></div>
