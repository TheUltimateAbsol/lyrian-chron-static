<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/corona-burst/">Corona Burst</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>240ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Celestial</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Heavy attack against the target that deals <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a> damage. For every 20ft of distance the target is away from you, this deals +1 damage. (Up to a maximum of +12)</p></div></div></div></article></div>
