<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/sanctioned-healer/">Sanctioned Healer</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When you attack an enemy with <a class="keyword" href="/keywords/sanctify/" data-tooltip="Attacks against you that hit heal an enemy attacker by 3+the applier&#39;s focus. After this triggers, the stacks of this debuff are reduced by 1. An attacker at full HP may choose not to trigger the effect.">Sanctify</a>, you may choose not to trigger the effect of it.</p></section><section><h4>Benefit 2</h4><p>You gain Elemental Mastery: Holy</p></section></div></div></article></div>
