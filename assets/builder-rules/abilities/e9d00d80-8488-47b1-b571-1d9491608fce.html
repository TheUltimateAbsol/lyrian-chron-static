<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--pyroblast/">Secret Art: Pyroblast</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>4</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a></span><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Heavy Attack against the target that deals double Heavy <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a> Damage. This attack gains <a class="keyword" href="/keywords/lock-on/" data-tooltip="Lock On attacks ignore the bonus from dodge.">Lock On</a> against a target that has the <a class="keyword" href="/keywords/burning/" data-tooltip="A Burning character takes X damage at the end of their turn. They may spend 1 AP to remove this effect.">Burning</a> condition that you inflicted on it.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
