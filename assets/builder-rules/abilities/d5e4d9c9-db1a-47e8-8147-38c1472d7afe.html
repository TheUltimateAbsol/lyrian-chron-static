<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/wall-formation/">Wall Formation</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Until the start of your next turn, every ally within range gains <strong>Wall Formation</strong>. If they are adjacent to another ally gains a +1 bonus to their guard and a +4 bonus to their block value.</p></div></div></div></article></div>
