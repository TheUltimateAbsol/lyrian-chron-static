<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/forked-lightning/">Forked Lightning</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>120ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Lightning</span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span><a class="keyword" href="/keywords/blanketing/" data-tooltip="When you make an attack against multiple targets with this ability, roll one accuracy and damage check that applies against all targets.">Blanketing</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light Attack against two different targets who can be no further than 20ft apart, dealing Lightning Damage and on damage, inflict <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> X where X equals your Focus x 2.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
