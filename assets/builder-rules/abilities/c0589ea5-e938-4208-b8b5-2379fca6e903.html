<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/in-the-zone/">In The Zone</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You add a crafting check to the item.&nbsp;This craft gains a +X bonus where X is equal to the amount of crafting dice spent this session.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be in a crafting session. Costs 1 Crafting Dice</p></div></section></div></div></article></div>
