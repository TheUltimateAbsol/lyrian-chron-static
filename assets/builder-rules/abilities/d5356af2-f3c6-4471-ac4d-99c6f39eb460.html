<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/full-bloom/">Full Bloom</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Healing</span><span><a class="keyword" href="/keywords/active/" data-tooltip="You cannot use the Prepare action on this ability.">Active</a></span><span><a class="keyword" href="/keywords/regrowth/" data-tooltip="You heal for 3+Focus (of the one who applied it) at the start of your turn.">Regrowth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You consume <a class="keyword" href="/keywords/regrowth/" data-tooltip="You heal for 3+Focus (of the one who applied it) at the start of your turn.">Regrowth</a> on the target, removing the buff and healing the target immediately for twice its regular value.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Target ally must have <a class="keyword" href="/keywords/regrowth/" data-tooltip="You heal for 3+Focus (of the one who applied it) at the start of your turn.">Regrowth</a> on them.</p></div></section></div></div></article></div>
