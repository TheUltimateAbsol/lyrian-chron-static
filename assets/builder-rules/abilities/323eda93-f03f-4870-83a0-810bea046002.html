<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/mighty-leap/">Mighty Leap</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/unbalanced/" data-tooltip="Your next attack that costs AP (even 0 AP) costs 1 extra AP.">Unbalanced</a></span><span>Jump</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You jump to a target within range and may make a Light attack against them. All enemies within 5ft of the target must make a save or become&nbsp;<strong><a class="keyword" href="/keywords/unbalanced/" data-tooltip="Your next attack that costs AP (even 0 AP) costs 1 extra AP.">Unbalanced</a></strong>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Two-Handed melee weapons only.</p></div></section></div></div></article></div>
