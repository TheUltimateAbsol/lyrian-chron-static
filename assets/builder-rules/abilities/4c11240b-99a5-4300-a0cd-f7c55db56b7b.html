<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/pillar-of-earth/">Pillar of Earth</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Earth</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You create a 5x5, 20ft high pillar below someone. The target may spend 1 RP to step out of the way.</p><p>Each block of the pillar has HP equal to 20+Focus and the entire pillar collapses if one block is removed from it.</p></div></div></div></article></div>
