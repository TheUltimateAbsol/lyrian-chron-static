<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/bone-armor/">Bone Armor</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>30ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You target and destroy a corpse within range to give yourself <strong>Bone Armor</strong>, which gives you a +2 bonus to your guard. Bone Armor lasts until the end of the encounter or until you take 2 or more damage from an attack.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Corpse within range.</p></div></section></div></div></article></div>
