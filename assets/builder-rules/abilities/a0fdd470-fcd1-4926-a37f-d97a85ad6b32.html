<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/soul-absorption/">Soul Absorption</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Dark</span><span><a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a></span><span><a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light Attack against a willing target that deals Light Dark damage. Your next Dark type <a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a> or Attack other than Soul Absorption gains extra damage equal to damage taken by the target. (Does not stack)</p></div></div></div></article></div>
