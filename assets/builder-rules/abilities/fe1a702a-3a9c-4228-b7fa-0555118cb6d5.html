<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/please-hold-still-/">Please Hold Still~</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You apply <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a> X to the target where X is your Focus. You cannot benefit from this <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a> yourself, but also cannot consume it.</p></div></div></div></article></div>
