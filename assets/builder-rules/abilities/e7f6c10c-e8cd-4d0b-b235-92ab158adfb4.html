<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/elemental-burst/">Elemental Burst</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>120ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You cause your attack to burst into the target causing them to take additional damage of that element equal to 2d4 + Focus.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Can be used after dealing elemental damage that does not contain the <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a> or <a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a> keywords.</p></div></section></div></div></article></div>
