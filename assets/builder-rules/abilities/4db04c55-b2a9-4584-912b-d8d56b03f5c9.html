<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/bottle-smash/">Bottle Smash</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/daze/" data-tooltip="You immediately lose 1 AP. If you do not have any AP, you instead regen 1 less AP at the start of your next turn. A dazed target becomes immune to Daze until the end of their next turn.">Daze</a></span><span><a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Light Attack against the target. On damage, the target becomes Dazed. After this attack, your improvised weapon breaks.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Improvised weapon only.</p></div></section></div></div></article></div>
