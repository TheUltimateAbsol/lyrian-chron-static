<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/static-overload/">Static Overload</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/daze/" data-tooltip="You immediately lose 1 AP. If you do not have any AP, you instead regen 1 less AP at the start of your next turn. A dazed target becomes immune to Daze until the end of their next turn.">Daze</a></span><span>Lightning</span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>A single target in range must make a save or immediately take Lightning damage equal to their <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> and become inflicted with&nbsp;<strong><a class="keyword" href="/keywords/daze/" data-tooltip="You immediately lose 1 AP. If you do not have any AP, you instead regen 1 less AP at the start of your next turn. A dazed target becomes immune to Daze until the end of their next turn.">Daze</a></strong>.&nbsp;</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>The target must be afflicted with <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> you applied.</p></div></section></div></div></article></div>
