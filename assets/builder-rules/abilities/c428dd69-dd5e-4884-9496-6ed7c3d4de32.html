<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--shock---awe/">Secret Art: Shock &amp; Awe</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>4</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You and up to 3 other allies within range gain 3 AP they must spend immediately. On their next turn, they regain 1 less AP.</p><p>These AP may not be spent on <a class="keyword" href="/keywords/setup/" data-tooltip="Setup attacks can be completed by spending AP in the following turn. While charging the attack, no other AP actions can be taken and attacks against you gain the Trick Attack keyword. You may cancel a setup attack instead of finishing it and don&#39;t need to spen">Setup</a> abilities and normal once per turn ability limitations apply.</p></div></div></div></article></div>
