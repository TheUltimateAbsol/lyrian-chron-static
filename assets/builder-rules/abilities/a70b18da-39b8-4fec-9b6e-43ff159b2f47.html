<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/thunderstorm/">Thunderstorm</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>3</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Lightning</span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span><a class="keyword" href="/keywords/scatter/" data-tooltip="When you make an attack against multiple targets with this ability, roll a separate accuracy and damage check against each target.">Scatter</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Light Attack that deals Lightning damage against all target enemies in range. As the attack comes from the sky, any cover is calculated from above the target rather than from your path to the target.</p></div></div></div></article></div>
