<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/kage-bunshin--kyomei/">Kage Bunshin: Kyomei</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/ninjutsu/" data-tooltip="This ability requires two free hands. You may wield Small weapon, Saboteur threaded dagger, One-handed thrown and Sets of Missiles weapons and still count as having your hand free.">Ninjutsu</a></span><span><a class="keyword" href="/keywords/stealth/" data-tooltip="This ability does not pull you out of Hiding. You must still be in low cover or concealment after using this ability to remain in Hiding.">Stealth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Your clone assists in the preparation of your next <a class="keyword" href="/keywords/ninjutsu/" data-tooltip="This ability requires two free hands. You may wield Small weapon, Saboteur threaded dagger, One-handed thrown and Sets of Missiles weapons and still count as having your hand free.">Ninjutsu</a>, reducing the AP cost of it by 1.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You must have a Bunshin clone active and within range.</p></div></section></div></div></article></div>
