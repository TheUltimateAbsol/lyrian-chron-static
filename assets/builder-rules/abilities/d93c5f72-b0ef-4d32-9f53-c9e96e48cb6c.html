<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/banana-peel/">Banana Peel</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You toss a banana peel in front of the target and they must make a Save or fall <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">prone</a>. If they fall <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">prone</a>, you may immediately use Pie Toss against them for 0 RP.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>An enemy is moving within range.</p></div></section></div></div></article></div>
