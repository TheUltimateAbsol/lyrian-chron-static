<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/surgical-precision/">Surgical Precision</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When you deal damage with a one-handed melee weapon that is both <a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a> and <a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a> or a critical hit, you inflict <a class="keyword" href="/keywords/bleeding/" data-tooltip="You take 1d6 true damage at the start of your turn.">Bleeding</a> on the target for 1 turn. This effect stacks with other Bleeds effects and itself up to 3 times.</p></section></div></div></article></div>
