<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/bolting/">Bolting</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>360ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Lightning</span><span><a class="keyword" href="/keywords/rapid/" data-tooltip="This ability can be used more than once per turn.">Rapid</a></span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span><a class="keyword" href="/keywords/artillery/" data-tooltip="The attack can target non-hidden units behind cover (even full cover) and any cover is calculated from above the target rather than from your position to the target.">Artillery</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Heavy Attack that deals Lightning Damage with a bolt from the sky. On damage, inflict <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a> X where X equals your Focus x 3.&nbsp;</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
