<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/snipe/">Snipe</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>You gain proficiency in Sniper Rifles.</p></section><section><h4>Benefit 2</h4><p>If you did not move this turn or the previous turn you gain a +1d4 Snipe bonus to your accuracy roll on attacks made with a Sniper Rifle.</p></section></div></div></article></div>
