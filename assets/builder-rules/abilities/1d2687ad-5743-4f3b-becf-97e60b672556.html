<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/prone-cover/">Prone Cover</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/stance/" data-tooltip="Only 1 Stance ability can be active at the same time.">Stance</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You become <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a>. While <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a> from this ability, you gain the benefits of low cover against ranged attacks. In addition, all Ranged Weapon Attacks gain the <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">Prone</a> keyword.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Cannot be used while Flying.</p></div></section></div></div></article></div>
