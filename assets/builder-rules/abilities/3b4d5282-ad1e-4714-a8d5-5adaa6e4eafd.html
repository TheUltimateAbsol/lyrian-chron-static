<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/evil-eye-of-death/">Evil Eye of Death</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>4</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/mystic-eye/" data-tooltip="This ability is made with a Mystic Eye.">Mystic Eye</a></span><span><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You open your <a class="keyword" href="/keywords/mystic-eye/" data-tooltip="This ability is made with a Mystic Eye.">Mystic Eye</a>, focus it on a single target and they instantly die.</p><p><strong><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a></strong>: 3 AP. When you pay the upkeep cost, you may repeat this attack against a new target.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Target must be a grunt.</p></div></section></div></div></article></div>
