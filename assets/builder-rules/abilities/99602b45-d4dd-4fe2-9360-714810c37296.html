<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/shieldcrusher/">Shieldcrusher</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/broken/" data-tooltip="Only applies to equipment. Armor and shields that are broken provide no benefit or negatives. Weapons that are broken can only be used as an improvised weapon.">Broken</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Heavy attack against the target. If they Block against this attack and are wielding a shield or greatshield, that shield becomes <a class="keyword" href="/keywords/broken/" data-tooltip="Only applies to equipment. Armor and shields that are broken provide no benefit or negatives. Weapons that are broken can only be used as an improvised weapon.">Broken</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Two-handed weapons only.</p></div></section></div></div></article></div>
