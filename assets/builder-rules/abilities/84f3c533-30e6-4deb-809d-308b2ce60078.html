<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--beaver-timber-fang/">Secret Art: Beaver Timber Fang</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>3</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a></span><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Make a normal heavy attack against the target. Afterwards make a light attack against the target with <a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a> that immediately renders the target <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">prone</a>, even if the damage is reduced to 0.</p></div></div></div></article></div>
