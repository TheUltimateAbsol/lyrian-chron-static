<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/flower-squirt/">Flower Squirt</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You press your flower and make a Light attack against the target that deals Water damage. On damage they are <a class="keyword" href="/keywords/soaked/" data-tooltip="A soaked target takes X additional damage when taking Lighting damage.">Soaked</a> for X, where X equals your Focus until the next time they take Lightning damage.</p></div></div></div></article></div>
