<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/resist-poison/">Resist Poison</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/rapid/" data-tooltip="This ability can be used more than once per turn.">Rapid</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You gain Resist Poison, which gives you Damage Reduction 100 against the triggering damage. You also resist the application of the poison, negating its effect.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You're about to take Poison damage or become afflicted with a Poison.</p></div></section></div></div></article></div>
