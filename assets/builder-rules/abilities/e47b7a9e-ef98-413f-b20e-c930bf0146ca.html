<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/cave-raider/">Cave Raider</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/circuit/" data-tooltip="The first time each combat you use an ability with this keyword, the mana cost is reduced by 1. Afterwards, this mana cost reduction is removed from all abilities with this keyword.">Circuit</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Until the start of your next turn, you gain the ability to climb your speed.&nbsp; In addition if you have rope, you can tie it to a secure object and you can rappel down a cliffside up to 50ft at the cost of 5ft of movement.</p></div></div></div></article></div>
