<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--shield-wall/">Secret Art: Shield Wall</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span><span class="ability-cost cost-mp"><b>6</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You and your allies in range gain <strong>Shield Wall</strong>, which reduces the damage they take from the triggering attack by 75.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Usable when you are the target of an ability that affects an area, using a shield.</p></div></section></div></div></article></div>
