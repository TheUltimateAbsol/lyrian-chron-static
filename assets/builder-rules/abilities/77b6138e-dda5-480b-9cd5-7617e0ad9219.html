<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/steal-time/">Steal Time</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Light Attack against the target. On damage, you inflict <strong>Time Stolen</strong>, which lowers their Initiative by 1 and you gain <strong>Stolen Time</strong>, which increases yours by 1. This effect can stack both on you and on enemies.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
