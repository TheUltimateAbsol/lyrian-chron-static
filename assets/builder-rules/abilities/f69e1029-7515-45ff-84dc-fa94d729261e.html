<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/wall-ride/">Wall Ride</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When you create a wall on your turn using your Geomancer or Geomaster abilities, you may move along the wall as it is created. You can jump off at any point of the wall creation, ending in an empty square next to the wall.</p></section></div></div></article></div>
