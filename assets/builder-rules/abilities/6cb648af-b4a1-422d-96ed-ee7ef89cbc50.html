<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/phantoms-of-the-mist/">Phantoms of the Mist</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/song/" data-tooltip="A character can only have 1 Song active at the same time.">Song</a></span><span><a class="keyword" href="/keywords/scatter/" data-tooltip="When you make an attack against multiple targets with this ability, roll a separate accuracy and damage check against each target.">Scatter</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You conjure several phantoms in the mist and make a Light attack against all creatures within your Mist of the Vale.</p><p>You may spend 1 Mana to exclude allies from this attack.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Mist of the Vale must be active.</p></div></section></div></div></article></div>
