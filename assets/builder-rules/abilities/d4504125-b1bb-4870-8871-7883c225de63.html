<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/spore-burst/">Spore Burst</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Earth</span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You create an explosion of spores in front of you.&nbsp;Make a Heavy Attack against the target that deals Poison damage.&nbsp;Afterwards, knock back the target 5ft and knock yourself back 5ft.&nbsp;This <a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a> does not trigger attacks of opportunity.</p></div></div></div></article></div>
