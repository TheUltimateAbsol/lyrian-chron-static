<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/superconductor/">Superconductor</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When you make an attack that deals Lightning damage to a target afflicted with <a class="keyword" href="/keywords/static/" data-tooltip="At the end of your next turn, you deal X lightning damage to all allies within 5ft of you.">Static</a>, you gain a +1 accuracy bonus.</p></section><section><h4>Benefit 2</h4><p>You gain Elemental Mastery: Lightning.</p></section></div></div></article></div>
