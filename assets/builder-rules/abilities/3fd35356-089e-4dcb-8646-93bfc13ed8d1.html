<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/anvil-tactics/">Anvil Tactics</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>80ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>A single ally in range may move up to their speed. If they end up in melee range of an enemy and there is an ally on the direct opposite side of that enemy, they may make an Attack of Opportunity. This attack gains <a class="keyword" href="/keywords/lock-on/" data-tooltip="Lock On attacks ignore the bonus from dodge.">Lock On</a>.</p></div></div></div></article></div>
