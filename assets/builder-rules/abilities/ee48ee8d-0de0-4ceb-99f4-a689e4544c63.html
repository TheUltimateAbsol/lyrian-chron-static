<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/plow-the-fields/">Plow the fields</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>15ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/blanketing/" data-tooltip="When you make an attack against multiple targets with this ability, roll one accuracy and damage check that applies against all targets.">Blanketing</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You strike the ground with magical power and make a Light attack against all enemies in a 15ft wide line up to range. The terrain within this range becomes difficult terrain until the start of your next turn.</p></div></div></div></article></div>
