<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/kiri-tsuke-ii/">Kiri-tsuke II</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Melee Weapon Range</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a></span><span><a class="keyword" href="/keywords/killing-blow/" data-tooltip="Killing Blow effects trigger when reducing the HP of enemy to 0 or lower. You cannot benefit from the same Killing Blow effect against the same target more than once.">Killing Blow</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may make a Heavy Attack against the target. On <a class="keyword" href="/keywords/killing-blow/" data-tooltip="Killing Blow effects trigger when reducing the HP of enemy to 0 or lower. You cannot benefit from the same Killing Blow effect against the same target more than once.">Killing Blow</a>, you regain the Iai state. <strong><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a>:</strong> If used after Iai Strike, the AP cost is reduced by 1.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">Katana only.</div></section></div></div></article></div>
