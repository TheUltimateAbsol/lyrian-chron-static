<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/judgement-shot/">Judgement Shot</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Ranged Weapon Range</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You make a Light attack against the target.</p><p>Afterwards, an ally other than you within 30ft of you may make a Light attack against the target. They may spend 1 RP to make this a Heavy or Precise attack instead.</p></div></div></div></article></div>
