<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/panda-roll/">Panda Roll</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You prepare to roll from an incoming attack. Your next Dodge action before the start of your next turn costs 0 RP. If you successfully avoid an attack with this Dodge action, you may <a class="keyword" href="/keywords/sidestep/" data-tooltip="Your movement does not provoke attacks of opportunities.">Sidestep</a> 5ft.&nbsp;</p></div></div></div></article></div>
