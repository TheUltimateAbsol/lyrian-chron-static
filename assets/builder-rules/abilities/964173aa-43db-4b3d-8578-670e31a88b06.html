<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/infernal-bastion/">Infernal Bastion</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/burning/" data-tooltip="A Burning character takes X damage at the end of their turn. They may spend 1 AP to remove this effect.">Burning</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You surround yourself with flames and take the Block action against the attack. If you reduce damage of this attack to 0, inflict <a class="keyword" href="/keywords/burning/" data-tooltip="A Burning character takes X damage at the end of their turn. They may spend 1 AP to remove this effect.">Burning</a> X on the target where X is your focus x 3.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You are targeted by a melee attack.</p></div></section></div></div></article></div>
