<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/plaguebringer/">Plaguebringer</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>When you damage an enemy with a melee attack while infected with a disease or suffering from poison, you inflict that disease or poison on the enemy. They can make a save against it as normal, if the original disease or poison allowed for it.</p></div></div></div></article></div>
