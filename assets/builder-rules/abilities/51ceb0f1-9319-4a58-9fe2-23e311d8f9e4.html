<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/thermal-vision/">Thermal Vision</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You can perfectly see and detect heat sources up to 120ft away, including stealthed creatures. This cannot detect things hidden by magical means. You can no longer discern a difference in heat once something reaches freezing temperatures.</p></div></div></div></article></div>
