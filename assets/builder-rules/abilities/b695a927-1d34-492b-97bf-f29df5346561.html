<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/living-lightning/">Living Lightning</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/sure-hit/" data-tooltip="Sure hit attacks always hit and do not require an accuracy roll, but they automatically miss against targets with full cover.">Sure Hit</a></span><span><a class="keyword" href="/keywords/full-pierce/" data-tooltip="Full pierce attacks cannot be reduced by guard.">Full Pierce</a></span><span><a class="keyword" href="/keywords/blanketing/" data-tooltip="When you make an attack against multiple targets with this ability, roll one accuracy and damage check that applies against all targets.">Blanketing</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You turn into a spark of lightning as you move. For this movement action, you deal Light Lightning damage to all creatures you pass through.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Not mounted and must move entirely in a straight line.</p></div></section></div></div></article></div>
