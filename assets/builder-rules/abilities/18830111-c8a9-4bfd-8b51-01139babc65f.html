<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/thick-skull/">Thick Skull</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>When you would get Dazed, you may make a Save against the effect even if it would normally not allow for one. If you already had to make a save to avoid it, then you don’t get another.</p></div></div></div></article></div>
