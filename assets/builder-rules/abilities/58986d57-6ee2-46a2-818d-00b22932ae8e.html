<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/benevolence/">Benevolence</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>You gain Elemental Mastery: Holy</p></section><section><h4>Benefit 2</h4><p>Your attacks do not consume <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a> on miss.</p></section><section><h4>Benefit 3</h4><p>You may choose not to use the effect of <a class="keyword" href="/keywords/illumination/" data-tooltip="The next attack against you gets an X bonus to the accuracy roll (Consumed even on a miss).">Illumination</a> on a target.(Must be declared before an attack is made).</p></section></div></div></article></div>
