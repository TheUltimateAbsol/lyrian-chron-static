<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/fireball/">Fireball</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a></span><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span><a class="keyword" href="/keywords/scatter/" data-tooltip="When you make an attack against multiple targets with this ability, roll a separate accuracy and damage check against each target.">Scatter</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You hurl a Fireball at a 15x15ft area, making a Light Attack that deals <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a> Damage against all units in the area.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
