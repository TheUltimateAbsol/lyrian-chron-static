<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/antennae/">Antennae</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You are able to detect creatures by sensing the vibrations in the air. You gain a +10 expertise bonus to Perception (Vibration Sense) which works up to 40ft from you, but only detects creatures.</p></div></div></div></article></div>
