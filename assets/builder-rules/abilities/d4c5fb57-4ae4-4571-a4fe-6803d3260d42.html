<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability class-ultimate-ability"><header class="ability-row-head"><div><p class="card-kind">Secret Art</p><h3><a href="/abilities/secret-art--full-combo/">Secret Art: Full Combo</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>3</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>30ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/song/" data-tooltip="A character can only have 1 Song active at the same time.">Song</a></span><span>Idol</span><span><a class="keyword" href="/keywords/sound/" data-tooltip="This ability&#39;s effect is based around sound. Those who can&#39;t hear it are unaffected.">Sound</a></span><span><a class="keyword" href="/keywords/secret-art/" data-tooltip="You can only use 1 ability with this keyword or with the Esoteric Art keyword per encounter.">Secret Art</a></span><span><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Your allies gain +4 <a class="keyword" href="/keywords/song/" data-tooltip="A character can only have 1 Song active at the same time.">Song</a> bonus to their damage rolls. This is doubled on Heavy attacks.</p><p>If an ally misses an attack, this bonus is reduced to +1.</p><p><strong><a class="keyword" href="/keywords/upkeep/" data-tooltip="You may choose to pay the cost at the beginning of your turn. If you don&#39;t, the effect is terminated. While downed, you cannot pay upkeep.">Upkeep</a></strong>: 1 AP</p></div></div></div></article></div>
