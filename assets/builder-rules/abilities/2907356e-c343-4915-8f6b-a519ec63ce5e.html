<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/catalyze/">Catalyze</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span>Poison</span><span><a class="keyword" href="/keywords/circuit/" data-tooltip="The first time each combat you use an ability with this keyword, the mana cost is reduced by 1. Afterwards, this mana cost reduction is removed from all abilities with this keyword.">Circuit</a></span><span><a class="keyword" href="/keywords/stagger/" data-tooltip="A character inflicted with Stagger has their evasion reduced by X, where X is the Stagger value.">Stagger</a></span><span><a class="keyword" href="/keywords/sunder/" data-tooltip="A character inflicted with Sunder has their guard reduced by X, where X is the Sunder value.">Sunder</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>The target must succeed at a Save. On failure, you inflict <a class="keyword" href="/keywords/stagger/" data-tooltip="A character inflicted with Stagger has their evasion reduced by X, where X is the Stagger value.">Stagger</a> II or <a class="keyword" href="/keywords/sunder/" data-tooltip="A character inflicted with Sunder has their guard reduced by X, where X is the Sunder value.">Sunder</a> II until the end of your next turn.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Target is afflicted with your <a class="keyword" href="/keywords/toxic/" data-tooltip="A character suffering from Toxic takes 1d6 Full Pierce Poison damage at the start of their turn.">Toxic</a>.</p></div></section></div></div></article></div>
