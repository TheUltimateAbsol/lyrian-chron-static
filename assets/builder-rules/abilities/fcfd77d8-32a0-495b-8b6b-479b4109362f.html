<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/quick-revive/">Quick Revive</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You immediately resummon the summon from your <a class="keyword" href="/keywords/summon/" data-tooltip="This ability counts towards your maximum summon limit. You can only have 2 summons active at the same time. A summon does not count as a valid target for abilities that require a ‘willing’ ally.">Summon</a> Animal that was killed in this current encounter. If multiple of your summons have died, you summon the one that died most recently.</p></div></div></div></article></div>
