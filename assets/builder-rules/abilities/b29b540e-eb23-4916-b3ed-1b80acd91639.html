<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/ki-circulation/">Ki Circulation</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span><span class="ability-cost cost-mp"><b>1</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You cycle the Ki inside your body and purge it from negative energy. You remove <a class="keyword" href="/keywords/bleeding/" data-tooltip="You take 1d6 true damage at the start of your turn.">Bleeding</a>, <a class="keyword" href="/keywords/shaken/" data-tooltip="The target&#39;s maximum AP is reduced by 1.">Shaken</a>, <a class="keyword" href="/keywords/unbalanced/" data-tooltip="Your next attack that costs AP (even 0 AP) costs 1 extra AP.">Unbalanced</a> or any Poison effect from yourself.</p></div></div></div></article></div>
