<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/memory-of-the-grove/">Memory of the Grove</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>&nbsp;After making a gathering check, you may choose to reroll the die. If you do, store the original die result. You may replace a future gathering die result (before bonus) with the stored value.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Usable after making a gathering a check.</p></div></section></div></div></article></div>
