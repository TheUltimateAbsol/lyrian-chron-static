<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/pack-tactics/">Pack Tactics</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>0</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Sight</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/quick/" data-tooltip="The first time after using an ability with Quick, other abilities with Quick used in same turn cost +1 AP.">Quick</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Select a target within range. Until the end of your turn, while the target has one of your allies within 5ft of it, you gain <strong>Pack Tactics</strong>, which gives a +2 bonus on accuracy checks for melee attacks against that target.</p></div></div></div></article></div>
