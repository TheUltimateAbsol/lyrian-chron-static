<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/earthen-divide/">Earthen Divide</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>3</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>5ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/spell/" data-tooltip="This ability is considered a spell. Unless stated otherwise, it will provoke attacks of opportunity.">Spell</a></span><span>Earth</span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You create a wall up to 20ft high, 5ft wide and 20ft long in a straight line. Each Segment of the wall has HP equal to 20 + Focus.</p><p><strong><a class="keyword" href="/keywords/overcharge/" data-tooltip="You may spend additional AP and/or Mana to increase the power of the ability.">Overcharge</a></strong>: You may spend X mana to increase the length by 20 x Xft.</p></div></div></div></article></div>
