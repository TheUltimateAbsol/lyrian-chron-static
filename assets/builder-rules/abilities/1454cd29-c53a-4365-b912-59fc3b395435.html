<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/quick-getaway/">Quick Getaway</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>-</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a></span><span><a class="keyword" href="/keywords/stealth/" data-tooltip="This ability does not pull you out of Hiding. You must still be in low cover or concealment after using this ability to remain in Hiding.">Stealth</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You may move as if you had spent 2 AP on the movement action. <strong><a class="keyword" href="/keywords/combo/" data-tooltip="Combo abilities gain a bonus when used directly after another ability. Combo abilities remain valid until you spend AP on a different ability or action.">Combo</a>:</strong> If used after Feint or the Disengage action, the AP cost of this is reduced by 2.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">-</div></section></div></div></article></div>
