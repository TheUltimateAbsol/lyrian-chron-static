<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/emergency-recall/">Emergency Recall</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Sight</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You give your summon 100 Damage Reduction against the attack. Afterwards, if it is still alive, it is immediately unsummoned.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Your summon from <a class="keyword" href="/keywords/summon/" data-tooltip="This ability counts towards your maximum summon limit. You can only have 2 summons active at the same time. A summon does not count as a valid target for abilities that require a ‘willing’ ally.">Summon</a> Animal is the target of an attack.</p></div></section></div></div></article></div>
