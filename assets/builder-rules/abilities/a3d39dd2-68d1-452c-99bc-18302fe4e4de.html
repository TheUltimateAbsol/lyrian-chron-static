<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Key ability</p><h3><a href="/abilities/key/infiltrate/">Infiltrate</a></h3></div><div class="ability-costs"><span class="ability-cost cost-key">Class feature</span></div></header><div class="ability-row-body"><div class="ability-full-text"><section><h4>Benefit 1</h4><p>When you use Decipher Magic, you may use Roguecraft instead of Magic as the skill for it. In addition, you can modify the effect in such a way that it no longer affects you and your allies rather than completely disabling it.</p></section></div></div></article></div>
