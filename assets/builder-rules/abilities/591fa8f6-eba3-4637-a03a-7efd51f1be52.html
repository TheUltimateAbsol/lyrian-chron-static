<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/devil-s-curse/">Devil&#39;s Curse</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>The attacker takes damage equal to the damage roll of the triggering attack. They cannot Dodge or Block this damage.</p><p>Does not work against Secret Arts, Climax Arts or similar level abilities.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>An enemy accuracy check against you rolls a 1.</p></div></section></div></div></article></div>
