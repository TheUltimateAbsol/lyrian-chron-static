<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/prehensile-tail/">Prehensile Tail</a></h3></div><div class="ability-costs"><span class="ability-cost cost-passive">No listed cost</span></div></header><div class="ability-row-body"><div class="ability-full-text"><div class="prose ability-description"><p>You may carry objects with your tail, allowing you to interact with objects as normal even when you have both hands full. The action you are performing must not require physical strength and you cannot wield weapons with your tail.</p></div></div></div></article></div>
