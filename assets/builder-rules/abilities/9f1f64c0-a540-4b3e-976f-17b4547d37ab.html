<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/swap/">Swap</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>1</b> AP</span><span class="ability-cost cost-rp"><b>1</b> RP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>20ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/rapid/" data-tooltip="This ability can be used more than once per turn.">Rapid</a></span><span><a class="keyword" href="/keywords/teleport/" data-tooltip="You teleport instead of moving normally. Teleportation does not provoke Attacks of Opportunity and ignores most forms of roots and grapples. You need to see where you teleport to, but can otherwise ignore difficult terrain and solid objects in the way. Unless ">Teleport</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You Swap positions with a chosen willing ally or any non-heroic enemy.</p><p>You may use either AP or RP for this ability. You don't need to pay the cost of both.</p></div></div></div></article></div>
