<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/aerial-crashdown/">Aerial Crashdown</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>60ft</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You and your mount crash down on the target. You move towards the target and your mount makes a Heavy attack against it. On damage, the target is knocked <a class="keyword" href="/keywords/prone/" data-tooltip="An ability with this keyword can be used while Prone with no penalty. All attacks without the Prone keyword cost +1 AP and RP while prone.">prone</a>.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>You are mounted on a flying mount and the target is at least 20ft below you.</p></div></section></div></div></article></div>
