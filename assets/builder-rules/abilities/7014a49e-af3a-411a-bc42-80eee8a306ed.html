<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/reinforce-armor/">Reinforce Armor</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-rp"><b>0</b> RP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>Self</strong></div></div><div class="ability-full-text"><div class="prose ability-description"><p>Until the start of your next turn, the guard and block value gained from an armor and shield you crafted and are wearing is doubled.</p><p>Does not affect armor plates.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose"><p>Must be wearing armor or a shield you crafted.</p></div></section></div></div></article></div>
