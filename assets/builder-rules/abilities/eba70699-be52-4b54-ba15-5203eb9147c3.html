<div class="ability-list class-detail-abilities"><article class="ability-row embedded-ability"><header class="ability-row-head"><div><p class="card-kind">Ability</p><h3><a href="/abilities/dragonfire-dive/">Dragonfire Dive</a></h3></div><div class="ability-costs" aria-label="Ability costs"><span class="ability-cost cost-ap"><b>2</b> AP</span><span class="ability-cost cost-mp"><b>2</b> MP</span></div></header><div class="ability-row-body"><div class="ability-facts"><div class="ability-range-fact"><span>Range</span><strong>40ft</strong></div><div class="ability-keywords-fact"><span>Keywords</span><div class="ability-keyword-badges"><span><a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a></span><span>Jump</span><span><a class="keyword" href="/keywords/blanketing/" data-tooltip="When you make an attack against multiple targets with this ability, roll one accuracy and damage check that applies against all targets.">Blanketing</a></span></div></div></div><div class="ability-full-text"><div class="prose ability-description"><p>You jump to the target, not provoking any attacks of opportunity, and attacking the target plus all other creatures within 5ft of the target for Heavy <a class="keyword" href="/keywords/fire/" data-tooltip="Spells and attacks that deal Fire damage may ignite flammable, unattended objects.">Fire</a> Damage.</p></div><section class="ability-requirement"><h4>Requirements</h4><div class="prose">Polearm only.</div></section></div></div></article></div>
